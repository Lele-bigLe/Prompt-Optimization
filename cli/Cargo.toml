[package]
name = "prompt-optimizer"
version = "0.4.3"
edition = "2021"
rust-version = "1.94"
description = "Codex 原生终端提示词优化器"
license = "MIT"

[[bin]]
name = "prompt-optimizer"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
crossterm = { version = "0.28", features = ["event-stream"] }
futures-util = { version = "0.3", features = ["sink"] }
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
strip-ansi-escapes = "0.2"
subtle = "2.6"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process", "io-util", "time", "sync", "signal", "fs"] }
tokio-tungstenite = "0.26"
tokio-util = { version = "0.7", features = ["rt"] }
tui-textarea = "0.7"
unicode-segmentation = "1"
unicode-width = "0.2"
uuid = { version = "1", features = ["v4", "serde"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_SystemInformation", "Win32_Security_Credentials"] }

[profile.release]
lto = "thin"
strip = true
